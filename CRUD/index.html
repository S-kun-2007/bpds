
<!doctype html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Juego de triqui para dos jugadores.">
	<title>Triqui | BPDS</title>
	<link rel="stylesheet" href="styles.css">
</head>
<body>
	<main class="game-shell">
		<section class="game-card" aria-labelledby="game-title">
			<header class="game-header">
				<p class="eyebrow">BPDS / JUEGO LOCAL</p>
				<h1 id="game-title">Triqui</h1>
				<p class="subtitle">Tres en línea. Una jugada a la vez.</p>
			</header>

			<section class="scoreboard" aria-label="Marcador">
				<div class="score score-x">
					<span class="player-label">Jugador X</span>
					<strong id="score-x">0</strong>
				</div>
				<div class="score score-draws">
					<span class="player-label">Empates</span>
					<strong id="score-draws">0</strong>
				</div>
				<div class="score score-o">
					<span class="player-label">Jugador O</span>
					<strong id="score-o">0</strong>
				</div>
			</section>

			<div class="game-status" role="status" aria-live="polite">
				<span class="status-dot" aria-hidden="true"></span>
				<span id="status">Turno del jugador X</span>
			</div>

			<div id="board" class="board" role="grid" aria-label="Tablero de triqui">
				<button class="cell" type="button" role="gridcell" aria-label="Casilla 1" data-index="0"></button>
				<button class="cell" type="button" role="gridcell" aria-label="Casilla 2" data-index="1"></button>
				<button class="cell" type="button" role="gridcell" aria-label="Casilla 3" data-index="2"></button>
				<button class="cell" type="button" role="gridcell" aria-label="Casilla 4" data-index="3"></button>
				<button class="cell" type="button" role="gridcell" aria-label="Casilla 5" data-index="4"></button>
				<button class="cell" type="button" role="gridcell" aria-label="Casilla 6" data-index="5"></button>
				<button class="cell" type="button" role="gridcell" aria-label="Casilla 7" data-index="6"></button>
				<button class="cell" type="button" role="gridcell" aria-label="Casilla 8" data-index="7"></button>
				<button class="cell" type="button" role="gridcell" aria-label="Casilla 9" data-index="8"></button>
			</div>

			<button id="reset-button" class="reset-button" type="button">Nueva partida</button>
		</section>
	</main>
	<script src="app.js"></script>
</body>
</html>
